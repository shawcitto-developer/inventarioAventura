{% extends 'base/base_publica.html' %}
{% block titulo %}Ingresar | Aventuras del Sur{% endblock %}
{% block contenido %}
<section class="seccion d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="card tarjeta-oscura mx-auto" style="max-width: 26rem;">
            <div class="card-body p-4">
                <h3 class="text-center fw-bold mb-4">Iniciar sesión</h3>
                <form method="post">
                    {% csrf_token %}
                    {% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Ingresar</button>
                </form>
                <hr>
                <p class="text-center mb-0 small">¿Eres turista y no tienes cuenta? <a href="{% url 'signup' %}">Regístrate</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
