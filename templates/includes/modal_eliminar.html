<form method="post">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title">Confirmar</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body">
        ¿Seguro que quieres eliminar <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No, volver</button>
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Sí, eliminar</button>
    </div>
</form>
